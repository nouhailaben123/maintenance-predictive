global:
  scrape_interval: 5s

scrape_configs:
  - job_name: monitoring-service
    static_configs:
      - targets: ["monitoring-service:9102"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]
